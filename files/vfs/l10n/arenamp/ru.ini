settings.tooltip.max_lights = По умолчанию: 8\nМаксимальное число источников света на один объект.\n\nЗначения около стандартного могут вызывать заметное появление источников света, как при классическом освещении.
settings.tooltip.max_light_distance = По умолчанию: 8192 единицы\nМаксимальная дальность появления источников света.\n\nЗначение 0 отключает ограничение дальности.
settings.tooltip.light_fade = По умолчанию: 0.85\nДоля максимальной дальности, с которой начинается затухание света.\n\nМеньшие значения дают плавный переход, большие — быстрый.
settings.tooltip.light_bounds = По умолчанию: 1.65\nМножитель ограничивающей сферы источников света. Большие значения дают более плавное затухание, но могут потребовать увеличить максимум источников.\n\nНа силу освещения параметр не влияет.
settings.tooltip.minimum_brightness = По умолчанию: 0.08\nМинимальная фоновая яркость интерьеров.\n\nУвеличьте значение, если помещения выглядят слишком тёмными.
settings.tooltip.material_quality = Переключает карты нормалей, отражений и параллакс без перезапуска. «Отключено» выключает карты материалов; «Простое» включает нормали; «Сбалансированное» добавляет отражения и лёгкий параллакс; «Качественное» включает POM и самозатенение; «Максимальное» включает максимальный POM, полостное AO и совместимые с PBR блики GGX. «Максимальное» доступно только при «Высокой» или «Максимальной» детализации ландшафта: при выборе PBR ландшафт повышается автоматически, а при понижении ландшафта PBR переключается на «Качественное».
hotkey.hdr_on = HDR включён
hotkey.hdr_off = HDR выключен
hotkey.bloom_on = Bloom включён
hotkey.bloom_off = Bloom выключен
settings.optimized_distance = Адаптивная дальность мира, теней и травы
settings.optimized_distance_value = Адаптивная дальность: %s
settings.tooltip.land_optimization = Динамически регулирует дальность на открытой местности. При включении появляется ползунок целевой дальности от 4 000 до 40 000, связанный с тенями и травой. Если FPS падает ниже выбранной цели, движок может плавно уменьшить все три расстояния до 50% и вернуть их после восстановления производительности.
settings.tooltip.optimized_distance = Задаёт желаемую максимальную дальность на улице. Тени используют 25%, а трава — 40% этого значения. Адаптивная оптимизация может временно уменьшить фактическую дальность вдвое, не изменяя выбранное значение.
