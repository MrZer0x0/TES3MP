name: Release builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [Main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_TYPE: Release
  CACHE_EPOCH: v6
  CCACHE_MAXSIZE: 2G

jobs:
  linux-steamdeck-x64:
    name: Linux / Steam Deck x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore Linux ccache
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: ${{ env.CACHE_EPOCH }}-linux-x64-ccache-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-linux-x64-ccache-
            ${{ env.CACHE_EPOCH }}-linux-x64-build-

      - name: Install dependencies
        run: bash CI/linux/install-deps.sh

      - name: Prepare bundled CrabNet/RakNet
        run: bash CI/ensure-bundled-deps.sh

      - name: Configure
        run: bash CI/linux/configure.sh

      - name: Build and package
        run: bash CI/linux/build-package.sh

      - name: Collect Linux diagnostics
        if: always()
        run: |
          set +e
          mkdir -p actions-artifacts/linux-steamdeck
          [ -d artifacts ] && cp -a artifacts/. actions-artifacts/linux-steamdeck/
          [ -f build/CMakeCache.txt ] && cp build/CMakeCache.txt actions-artifacts/linux-steamdeck/
          ccache --show-stats > actions-artifacts/linux-steamdeck/ccache-stats.txt 2>&1 || true
          find build -maxdepth 3 -type f 2>/dev/null | sort > actions-artifacts/linux-steamdeck/build-files.txt || true
          printf 'workflow=%s\nrun_id=%s\nref=%s\ncommit=%s\nrunner_arch=%s\nrunner_os=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_REF" "$GITHUB_SHA" "$RUNNER_ARCH" "$RUNNER_OS" \
            > actions-artifacts/linux-steamdeck/BUILD_INFO.txt

      - name: Upload Linux / Steam Deck artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-Linux-x86_64-SteamDeck
          path: actions-artifacts/linux-steamdeck/*
          if-no-files-found: warn
          retention-days: 30

  macos-arm64:
    name: macOS arm64
    runs-on: macos-26-arm64
    timeout-minutes: 150
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_CACHE: ${{ github.workspace }}/.cache/homebrew
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify native ARM64 runner
        run: |
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"

      - name: Restore macOS caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/homebrew
            .cache/ccache
            ${{ runner.temp }}/MyGUI/install
          key: ${{ env.CACHE_EPOCH }}-macos-arm64-deps-${{ hashFiles('CI/macos-arm64/install-deps.sh') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-macos-arm64-deps-${{ hashFiles('CI/macos-arm64/install-deps.sh') }}-
            ${{ env.CACHE_EPOCH }}-macos-arm64-deps-

      - name: Install native ARM64 dependencies
        run: bash CI/macos-arm64/install-deps.sh

      - name: Prepare bundled CrabNet/RakNet
        run: bash CI/ensure-bundled-deps.sh

      - name: Configure
        run: bash CI/macos-arm64/configure.sh

      - name: Build and package
        run: bash CI/macos-arm64/build-package.sh

      - name: Collect macOS package and diagnostics
        if: always()
        run: |
          set +e
          mkdir -p actions-artifacts/macos-arm64
          [ -d artifacts ] && cp -a artifacts/. actions-artifacts/macos-arm64/
          [ -f build/CMakeCache.txt ] && cp build/CMakeCache.txt actions-artifacts/macos-arm64/
          ccache --show-stats > actions-artifacts/macos-arm64/ccache-stats.txt 2>&1 || true
          find build -maxdepth 3 -type f 2>/dev/null | sort > actions-artifacts/macos-arm64/build-files.txt || true
          printf 'workflow=%s\nrun_id=%s\nref=%s\ncommit=%s\nrunner_arch=%s\nrunner_os=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_REF" "$GITHUB_SHA" "$RUNNER_ARCH" "$RUNNER_OS" \
            > actions-artifacts/macos-arm64/BUILD_INFO.txt

      - name: Upload macOS ARM64 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-macOS-arm64
          path: actions-artifacts/macos-arm64/*
          if-no-files-found: warn
          retention-days: 30
