name: Build Linux and macOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [Main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: unix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CCACHE_MAXSIZE: 2G

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: v4-linux-x64-ccache-${{ github.sha }}
          restore-keys: v4-linux-x64-ccache-

      - name: Prepare bundled dependencies
        run: CI/ensure-bundled-deps.sh

      - name: Install dependencies
        run: bash CI/linux/install-deps.sh

      - name: Configure
        run: bash CI/linux/configure.sh

      - name: Build and package
        run: bash CI/linux/build-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-Linux-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    name: macOS arm64
    runs-on: macos-26-arm64
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_CACHE: ${{ github.workspace }}/.cache/homebrew
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/cache@v5
        with:
          path: |
            .cache/homebrew
            .cache/ccache
            ${{ runner.temp }}/MyGUI/install
          key: v4-macos-arm64-deps-${{ hashFiles('CI/macos-arm64/install-deps.sh') }}-${{ github.sha }}
          restore-keys: |
            v4-macos-arm64-deps-${{ hashFiles('CI/macos-arm64/install-deps.sh') }}-
            v4-macos-arm64-deps-

      - name: Prepare bundled dependencies
        run: CI/ensure-bundled-deps.sh

      - name: Install dependencies
        run: bash CI/macos-arm64/install-deps.sh

      - name: Configure
        run: bash CI/macos-arm64/configure.sh

      - name: Build and package
        run: bash CI/macos-arm64/build-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-macOS-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
